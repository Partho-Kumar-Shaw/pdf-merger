<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart File Merger</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

{% include 'navbar.html' %}

<section class="hero-section mx-5 my-5">

<div class="overlay"></div>

<div class="container">

<div class="row align-items-center min-vh-100">

<div class="col-lg-6">

<h1 class="hero-title mx-5 my-5"  >
Merge Files Like a Pro
</h1>

<p class="hero-subtitle">
AI Powered PDF + DOCX Merger with Stunning UI
</p>

<form action="/merge" method="POST" enctype="multipart/form-data" id="uploadForm">

<div class="upload-box glass-card">

<i class="fa-solid fa-cloud-arrow-up upload-icon"></i>

<h4>Drag & Drop Files</h4>

<p>Upload PDFs, DOCX, TXT</p>

<input type="file" name="files" id="fileInput" multiple hidden>

<button type="button" class="btn btn-glass" id="browseBtn">
Choose Files
</button>

</div>

<div id="previewContainer"></div>

<div class="progress mt-4">
<div class="progress-bar progress-bar-striped progress-bar-animated"
id="progressBar"
style="width:0%">
0%
</div>
</div>

<button class="btn btn-danger btn-lg mt-4 w-100">
<i class="fa-solid fa-layer-group"></i>
Merge Files
</button>

</form>

</div>

<div class="col-lg-6 text-center">

<div class="floating-card glass-card">

<i class="fa-solid fa-file-pdf giant-icon"></i>

<h2>Fast Secure Smart</h2>

<p>
Advanced AI File Processing System
</p>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
