<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartMerge - Workspace</title>
  <meta name="description" content="Interactive multi-file document merger workspace with real-time sortable ordering and custom output names.">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Custom Glassy Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  {% include 'navbar.html' %}

  <section class="hero-section pb-5">
    <div class="container" style="max-width: 900px;">
      
      <!-- Workspace Header -->
      <div class="text-center mb-5">
        <h1 class="hero-title mb-2">Merger Workspace</h1>
        <p class="hero-subtitle">Upload, reorder, and combine your PDFs, Word files, text docs, and images.</p>
      </div>

      <!-- Main Form -->
      <form action="/merge" method="POST" enctype="multipart/form-data" id="uploadForm">
        
        <!-- Drag & Drop Upload Zone -->
        <div class="upload-box glass-card mb-4" id="dropZone">
          <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
          <h4 class="fw-bold mb-2">Drag & Drop Files Here</h4>
          <p class="text-muted fs-7 mb-3">Supports PDF, DOCX, TXT, PNG, JPG, JPEG (Max 50MB per file)</p>
          
          <input type="file" name="files" id="fileInput" multiple hidden accept=".pdf,.docx,.txt,.png,.jpg,.jpeg">
          
          <button type="button" class="btn btn-glass-outline btn-sm px-4" id="browseBtn">
            <i class="fa-solid fa-folder-open me-2"></i> Browse Computer
          </button>
        </div>

        <!-- Custom Output Filename Option -->
        <div class="glass-card p-4 mb-4">
          <div class="row g-3 align-items-center">
            <div class="col-md-7">
              <label for="customNameInput" class="form-label fw-bold text-white fs-7 mb-1">
                <i class="fa-solid fa-pen-to-square me-1"></i> Custom Output Filename (Optional)
              </label>
              <input type="text" name="custom_name" id="customNameInput" class="form-control glass-input" placeholder="e.g. Project_Merged_Report">
            </div>
            <div class="col-md-5 text-md-end pt-md-4">
              <span class="badge bg-white bg-opacity-10 border border-white border-opacity-20 text-slate-200 p-2">
                <i class="fa-solid fa-circle-info me-1"></i> Files order = Merge order
              </span>
            </div>
          </div>
        </div>

        <!-- File Preview List -->
        <div id="previewContainerWrapper" class="mb-4 d-none">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold m-0 text-white fs-6">
              <i class="fa-solid fa-list-ol me-2"></i> Queued Files (<span id="fileCount">0</span>)
            </h5>
            <button type="button" class="btn btn-action-danger" id="clearAllBtn">
              <i class="fa-solid fa-trash-can me-1"></i> Clear All
            </button>
          </div>

          <div id="previewContainer"></div>
        </div>

        <!-- Progress Indicator -->
        <div id="progressWrapper" class="mb-4 d-none">
          <div class="d-flex justify-content-between text-muted fs-7 mb-2">
            <span><i class="fa-solid fa-gear fa-spin me-1"></i> Processing document merger...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress progress-glass">
            <div class="progress-bar-fill" id="progressBar" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-glass-primary btn-lg w-100 py-3 shadow-lg" id="submitBtn">
          <i class="fa-solid fa-layer-group fs-5 me-2"></i> Merge & Download Document
        </button>

      </form>

    </div>
  </section>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
